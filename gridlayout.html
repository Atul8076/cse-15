<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid layout</title>
    <style>
        html,*{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        main{
            width: 1000px;
            height: auto;
            background-color: aqua;
            margin: o auto;
            display: grid;
            grid-template-rows: repeat(4,1fr);
            gap: 10px 20px;
        }
        .box{
            
            background-color: brown;
            height: 100px;
        }
        .box:nth-child(4){
            background-color: chartreuse;
            display: grid;
            grid-template-columns:repeat(2,1fr) ;
            gap:10px;
            text-align: center;
        }

            
        
         
    </style>
</head>
<body>
    <main>
        <div class="box"><h3>product 1</h3></div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">
            <div class="box4">left</div>
            <div class="box4">right</div>
        </div>
    </main>
</body>
</html>
