<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Product Page</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>

    <header class="main-header">
        <h1>electronic Store</h1>
    </header>

    <div class="product-container">
        <div class="product-image">
            <img src="https://www.headphonezone.in/cdn/shop/files/Headphone-Zone-CCA-POLARIS-1160-1160.jpg?v=1725439386&width=1000" alt="Premium Wireless Headphones">
        </div>

        <div class="product-details">
            <h2 class="product-title">Headphones</h2>

            

            <p class="price">$999.99</p>

            <p class="description">
               HEADPHONE ZONE X FIIO
                   JD1
                 In-Ears With 10mm Dynamic Driver
            </p>

            <div class="features">
                <ul>
                    <li><strong>Color:</strong> black</li>
                    <li><strong>Quality:</strong>Premium sound </li>
                    <li><strong></strong>   </li>
                </ul>
            </div>

            <button class="add-to-cart-btn">
                Add to Cart
            </button>
            
            <p class="stock-info">
                In Stock. Ready to ship in 1-2 business days.
            </p>
        </div>
    </div>

    <footer class="main-footer">
        &copy; 2025 TechGadgets. All rights reserved.
    </footer>

</body>
</html>
